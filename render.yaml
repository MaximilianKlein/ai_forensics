services:
  - type: web
    name: ai-forensics
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: MODELS_DIR
        value: /models
      - key: DEFAULT_MODEL
        value: qwen2.5-0.5b-instruct-q4_k_m.gguf
      - key: ALLOWED_MODELS
        value: qwen2.5-0.5b-instruct-q4_k_m.gguf
      - key: LIMITED_CAPABILITIES_WARNING
        value: "true"
      - key: DEMO_BANNER_MESSAGE
        value: "Limited AI model capabilities (0.5B) in cloud demo. Run locally with Ollama or deploy your own instance to explore larger models."
      - key: LLAMA_N_CTX
        value: 1024
      - key: LLAMA_N_THREADS
        value: 1
      - key: LLAMA_N_GPU_LAYERS
        value: 0
